name: Dual-Platform CI & Release (Windows + Linux)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_NO_ATTACH_CONSOLE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch and SHA-256 verify pinned Windows FFmpeg 8.1.2 into resources/media
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-full_build.7z"
          $expectedSha = "0fff188997a499b5382e0f66e845d4556c48c54f0113ebed4853d556dbdd7059"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-8.1.2-full_build.7z"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            throw "FFmpeg 压缩包 SHA-256 校验失败: $actualSha != $expectedSha"
          }

          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          7z e $archive "ffmpeg-8.1.2-full_build\bin\ffmpeg.exe" "ffmpeg-8.1.2-full_build\bin\ffprobe.exe" "-o$extractDir" -y | Out-Null

          $mediaDir = Join-Path (Get-Location) "resources\media"
          New-Item -ItemType Directory -Path $mediaDir -Force | Out-Null
          Copy-Item (Join-Path $extractDir "ffmpeg.exe") (Join-Path $mediaDir "ffmpeg.exe") -Force
          Copy-Item (Join-Path $extractDir "ffprobe.exe") (Join-Path $mediaDir "ffprobe.exe") -Force
          & (Join-Path $mediaDir "ffmpeg.exe") -version | Select-Object -First 2

      - name: Typecheck, lint, and unit tests (with real Windows FFmpeg)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pnpm typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm vitest run --reporter=verbose
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            Write-Host "=== VITEST FAILED (exit=$code / 0x$($code.ToString('X8'))) — RUNNING STEP-BY-STEP 0xC0000409 PROBE ==="
            $probeFile = "src/main/storage/__win_probe.test.ts"
            $probeCode = @'
import { mkdtempSync, rmSync } from "node:fs";
import { tmpdir } from "node:os";
import { join } from "node:path";
import { describe, it } from "vitest";
import { ProjectStore } from "./project-store";

describe("win-probe", () => {
  it("traces project-store test #2 line by line", () => {
    const log = (s: string) => process.stderr.write(`[PROBE] ${s}\n`);
    log("1:mkdtemp");
    const base = mkdtempSync(join(tmpdir(), "aivora-probe-"));
    const ws = join(base, "测试 作品 空间");
    log("2:new ProjectStore(ws)");
    const s1 = new ProjectStore(ws);
    log("3:createProject");
    const created = s1.createProject({ name: "雨夜 归人（第一季）", aspectRatio: "16:9", stylePreset: "国漫电影质感" });
    log("4:updateEpisode+createEpisode+createAsset+toggleAssetLock");
    const ep1 = created.episodes[0]!;
    s1.updateEpisode({ projectId: created.project.id, episodeId: ep1.id, title: "第 1 集", scriptText: "暴雨倾盆" });
    s1.createEpisode(created.project.id, "第 2 集");
    const asset = s1.createAsset({ projectId: created.project.id, kind: "character", name: "沈知行", description: "风衣" });
    s1.toggleAssetLock(created.project.id, asset.id);
    log("5:createShot+updateShot+addSyntheticTake+selectTake");
    const shot = s1.createShot({ projectId: created.project.id, episodeId: ep1.id, sceneId: created.scenes[0]!.id });
    s1.updateShot({ projectId: created.project.id, shotId: shot.id, title: "镜 01", scale: "特写", cameraMove: "缓推", durationSec: 5, visualPrompt: "雨滴" });
    const t1 = s1.addSyntheticTake({ projectId: created.project.id, shotId: shot.id, kind: "image", label: "初版" });
    s1.addSyntheticTake({ projectId: created.project.id, shotId: shot.id, kind: "image", label: "暖光版" });
    s1.selectTake({ projectId: created.project.id, shotId: shot.id, takeId: t1.takes.find((t) => t.shotId === shot.id)!.id, kind: "image" });
    log("6:s1.closeAll");
    s1.closeAll();
    log("7:new ProjectStore(ws) scanProjects readOnly");
    const s2 = new ProjectStore(ws);
    log("8:s2.listProjects");
    s2.listProjects();
    log("9:s2.openProject");
    s2.openProject(created.project.id);
    log("10:s2.closeAll");
    s2.closeAll();
    log("11:rmSync");
    rmSync(base, { recursive: true, force: true });
    log("12:ALL_STEPS_DONE");
  });
});
'@
            Set-Content -Path $probeFile -Value $probeCode -Encoding utf8
            try {
              node ./node_modules/vitest/vitest.mjs run $probeFile --reporter=verbose --pool=threads --poolOptions.threads.maxThreads=1 --poolOptions.threads.minThreads=1
              Write-Host "=== PROBE(threads) EXIT=$LASTEXITCODE / 0x$($LASTEXITCODE.ToString('X8')) ==="
              node ./node_modules/vitest/vitest.mjs run $probeFile --reporter=verbose --pool=forks --poolOptions.forks.maxForks=1 --poolOptions.forks.minForks=1
              Write-Host "=== PROBE(forks) EXIT=$LASTEXITCODE / 0x$($LASTEXITCODE.ToString('X8')) ==="
            } finally {
              Remove-Item $probeFile -Force -ErrorAction SilentlyContinue
            }
            exit $code
          }

      - name: Verify bundled CJK font and build Windows x64 NSIS installer (with bundled FFmpeg)
        shell: pwsh
        run: |
          if (-not (Test-Path "resources\fonts\NotoSansCJK-Regular.ttc") -or -not (Test-Path "resources\fonts\OFL-1.1-LICENSE.txt")) {
            throw "缺少随包 SIL OFL 1.1 中文字体或授权文件"
          }
          pnpm build:win

      - name: Verify installer output and compute SHA-256
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "release" -Filter "AIVORA-Studio-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "未在 release 目录找到 NSIS 安装包" }
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installer: $($exe.Name)"
          Write-Host "Size: $([Math]::Round($exe.Length / 1MB, 2)) MB"
          Write-Host "SHA-256: $hash"
          "$hash  $($exe.Name)" | Out-File -FilePath "release/SHA256SUMS-win.txt" -Encoding ascii
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Non-admin HKCU install, Chinese+space FFmpeg/ZIP smoke, overwrite-upgrade, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerPath = "${{ steps.installer.outputs.path }}"
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\AIVORA Studio"
          $installedExe = Join-Path $installDir "AIVORA Studio.exe"
          $uninstallExe = Join-Path $installDir "Uninstall AIVORA Studio.exe"

          function Invoke-NonAdminInstall($taskName) {
            $installCmd = "`"$installerPath`" /S /currentuser"
            schtasks /Create /TN $taskName /TR $installCmd /SC ONCE /ST 23:59 /RL LIMITED /F | Out-Null
            try {
              schtasks /Run /TN $taskName | Out-Null
              $deadline = (Get-Date).AddMinutes(3)
              while ((Get-Date) -lt $deadline) {
                Start-Sleep -Seconds 2
                if (Test-Path $installedExe) {
                  $running = Get-Process -Name ([System.IO.Path]::GetFileNameWithoutExtension($installerPath)) -ErrorAction SilentlyContinue
                  if (-not $running) { break }
                }
              }
            } finally {
              schtasks /Delete /TN $taskName /F 2>$null | Out-Null
            }
          }

          Invoke-NonAdminInstall "AivoraNonAdminInstall1"
          if (-not (Test-Path $installedExe)) {
            throw "非管理员静默安装失败：未在 $installedExe 找到主程序"
          }

          $hklmPaths = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $hklmHits = Get-ItemProperty $hklmPaths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*AIVORA Studio*" }
          if ($hklmHits) {
            throw "检测到 HKLM 注册表写入，违反普通用户 HKCU 安装规范"
          }

          $workspaceDir = Join-Path $env:RUNNER_TEMP "测试 作品 空间"
          $smokeReport = Join-Path $env:RUNNER_TEMP "aivora-smoke-report.json"
          New-Item -ItemType Directory -Path $workspaceDir -Force | Out-Null
          if (Test-Path $smokeReport) { Remove-Item $smokeReport -Force }

          $env:AIVORA_WORKSPACE_DIR = $workspaceDir
          $env:AIVORA_SMOKE_REPORT = $smokeReport
          $env:AIVORA_SMOKE_VERIFY_EXISTING = ""
          $proc = Start-Process -FilePath $installedExe -PassThru -Wait
          if ($proc.ExitCode -ne 0) { throw "安装包启动冒烟失败，退出码：$($proc.ExitCode)" }
          $report = Get-Content -Path $smokeReport -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host ($report | ConvertTo-Json -Depth 4)
          if (-not $report.ok -or $report.sqliteEngine -ne "node:sqlite" -or -not $report.archiveRoundtripOk -or -not $report.ffmpegAvailable -or -not $report.exportOk) {
            throw "全链路冒烟报告校验未通过"
          }
          if (-not (Test-Path $report.exportedPath)) {
            throw "未找到导出的中文名 MP4 成片：$($report.exportedPath)"
          }

          Invoke-NonAdminInstall "AivoraNonAdminUpgrade2"
          $upgradeReport = Join-Path $env:RUNNER_TEMP "aivora-upgrade-report.json"
          $env:AIVORA_SMOKE_REPORT = $upgradeReport
          $env:AIVORA_SMOKE_VERIFY_EXISTING = "1"
          $proc2 = Start-Process -FilePath $installedExe -PassThru -Wait
          if ($proc2.ExitCode -ne 0) { throw "覆盖安装后启动校验失败，退出码：$($proc2.ExitCode)" }
          $up = Get-Content -Path $upgradeReport -Raw -Encoding UTF8 | ConvertFrom-Json
          if (-not $up.ok) { throw "覆盖安装后历史作品读回失败" }

          if (Test-Path $uninstallExe) {
            Start-Process -FilePath $uninstallExe -ArgumentList "/S" -Wait
          }
          if (-not (Test-Path $report.projectDir)) {
            throw "卸载后用户作品目录被意外删除：$($report.projectDir)"
          }

      - name: Upload Windows NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIVORA-Studio-Setup-win-x64
          path: |
            release/AIVORA-Studio-Setup-*.exe
            release/SHA256SUMS-win.txt
          if-no-files-found: error
          retention-days: 30

  linux-build-and-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install system packages for Linux Electron smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch and SHA-256 verify pinned Linux static FFmpeg 8.1.3 into resources/media
        run: |
          set -euo pipefail
          URL="https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-11-23-12-43/ffmpeg-n8.1.3-39-g660b5aa7db-linux64-gpl-8.1.tar.xz"
          EXPECTED_SHA="255b73431adc3c14f91533b6cf08090c0b1314f6789761140a196f820f6347a2"
          ARCHIVE="$RUNNER_TEMP/ffmpeg-linux64.tar.xz"
          EXTRACT_DIR="$RUNNER_TEMP/ffmpeg-linux-extract"

          curl -fL "$URL" -o "$ARCHIVE"
          ACTUAL_SHA=$(sha256sum "$ARCHIVE" | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Linux FFmpeg SHA-256 mismatch: $ACTUAL_SHA != $EXPECTED_SHA"
            exit 1
          fi

          mkdir -p "$EXTRACT_DIR" resources/media
          tar -xf "$ARCHIVE" -C "$EXTRACT_DIR"
          cp "$EXTRACT_DIR"/*/bin/ffmpeg resources/media/ffmpeg
          cp "$EXTRACT_DIR"/*/bin/ffprobe resources/media/ffprobe
          chmod +x resources/media/ffmpeg resources/media/ffprobe
          ./resources/media/ffmpeg -version | head -n 2

      - name: Typecheck, lint, and unit tests (with real Linux FFmpeg)
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Verify bundled CJK font and run layout audit
        run: |
          set -euo pipefail
          test -s resources/fonts/NotoSansCJK-Regular.ttc
          test -s resources/fonts/OFL-1.1-LICENSE.txt
          pnpm build
          pnpm audit:layout

      - name: Build Linux x64 AppImage & deb packages (with bundled FFmpeg)
        run: pnpm build:linux

      - name: Verify Linux packages and compute SHA-256
        run: |
          set -euo pipefail
          ls -lh release/
          ls -lh release/AIVORA-Studio-*.AppImage release/AIVORA-Studio-*.deb
          (cd release && sha256sum AIVORA-Studio-*.AppImage AIVORA-Studio-*.deb > SHA256SUMS-linux.txt)
          cat release/SHA256SUMS-linux.txt

      - name: Install .deb and run Chinese+space FFmpeg/ZIP/SQLite headless smoke
        run: |
          set -euo pipefail
          DEB_FILE=$(ls release/AIVORA-Studio-*.deb | head -n 1)
          sudo apt-get install -y "./$DEB_FILE"
          BIN_PATH=$(command -v aivora-studio || echo "/opt/AIVORA Studio/aivora-studio")
          echo "Resolved Linux binary: $BIN_PATH"
          test -x "$BIN_PATH"

          WS_DIR="$RUNNER_TEMP/测试 作品 空间"
          REPORT="$RUNNER_TEMP/aivora-linux-smoke.json"
          mkdir -p "$WS_DIR"
          AIVORA_WORKSPACE_DIR="$WS_DIR" \
          AIVORA_SMOKE_REPORT="$REPORT" \
          xvfb-run -a "$BIN_PATH" --no-sandbox

          cat "$REPORT"
          node -e '
            const fs = require("node:fs");
            const r = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!r.ok || r.sqliteEngine !== "node:sqlite" || !r.archiveRoundtripOk || !r.ffmpegAvailable || !r.exportOk) {
              console.error("Linux smoke check failed:", r);
              process.exit(1);
            }
            if (!fs.existsSync(r.exportedPath)) {
              console.error("Missing exported MP4:", r.exportedPath);
              process.exit(1);
            }
            console.log("Verified Linux exported MP4:", r.exportedPath, fs.statSync(r.exportedPath).size, "bytes");
          ' "$REPORT"

      - name: Upload Linux AppImage & deb artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIVORA-Studio-linux-x64
          path: |
            release/AIVORA-Studio-*.AppImage
            release/AIVORA-Studio-*.deb
            release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-build-and-smoke, linux-build-and-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository for release notes
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: AIVORA-Studio-Setup-win-x64
          path: dist-release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: AIVORA-Studio-linux-x64
          path: dist-release

      - name: Create Draft dual-platform GitHub Release (requires manual review before publishing)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          cat dist-release/SHA256SUMS-win.txt dist-release/SHA256SUMS-linux.txt | tr -d '\r' > dist-release/SHA256SUMS.txt
          test -s dist-release/SHA256SUMS.txt
          WIN_NAME=$(basename dist-release/AIVORA-Studio-Setup-*.exe)
          APPIMAGE_NAME=$(basename dist-release/AIVORA-Studio-*.AppImage)
          DEB_NAME=$(basename dist-release/AIVORA-Studio-*.deb)

          NOTES_SRC="docs/release-notes-${TAG}.md"
          if [ ! -f "$NOTES_SRC" ]; then
            NOTES_SRC="docs/release-notes-v2.0.0.md"
          fi
          test -s "$NOTES_SRC"

          {
            echo "## AIVORA Studio ${TAG} — Windows + Linux 双平台候选发布（草稿）"
            echo ""
            echo "### 安装包（均已内置经 SHA-256 校验的 FFmpeg 与 SIL OFL 1.1 中文字体，零 Python / 零额外依赖）"
            echo "- **Windows 10/11 (x64)**：\`${WIN_NAME}\`（普通用户 HKCU 安装，无需管理员权限）"
            echo "- **Linux 通用免安装 (x64)**：\`${APPIMAGE_NAME}\`（\`chmod +x\` 后运行；Ubuntu 24.04 如遇 AppArmor 沙箱提示请附加 \`--no-sandbox\`）"
            echo "- **Ubuntu / Debian (x64)**：\`${DEB_NAME}\`（执行 \`sudo apt install ./${DEB_NAME}\`）"
            echo ""
            echo "### SHA-256 校验值"
            echo '```'
            cat dist-release/SHA256SUMS.txt
            echo '```'
            echo ""
            cat "$NOTES_SRC"
          } > dist-release/RELEASE_NOTES.md

          gh release create "$TAG" \
            -R "$GITHUB_REPOSITORY" \
            --draft \
            "dist-release/$WIN_NAME" \
            "dist-release/$APPIMAGE_NAME" \
            "dist-release/$DEB_NAME" \
            "dist-release/SHA256SUMS.txt" \
            --title "AIVORA Studio $TAG (Windows + Linux)" \
            --notes-file dist-release/RELEASE_NOTES.md

