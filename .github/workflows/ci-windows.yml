name: Windows CI & NSIS Installer Smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build-and-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      ELECTRON_NO_ATTACH_CONSOLE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch and SHA-256 verify pinned Windows FFmpeg 8.1.2 into resources/media
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-full_build.7z"
          $expectedSha = "0fff188997a499b5382e0f66e845d4556c48c54f0113ebed4853d556dbdd7059"
          $archive = Join-Path $env:RUNNER_TEMP "ffmpeg-8.1.2-full_build.7z"
          $extractDir = Join-Path $env:RUNNER_TEMP "ffmpeg-extract"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualSha = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha -ne $expectedSha) {
            throw "FFmpeg 压缩包 SHA-256 校验失败: $actualSha != $expectedSha"
          }

          New-Item -ItemType Directory -Path $extractDir -Force | Out-Null
          7z e $archive "ffmpeg-8.1.2-full_build\bin\ffmpeg.exe" "ffmpeg-8.1.2-full_build\bin\ffprobe.exe" "-o$extractDir" -y | Out-Null

          $mediaDir = Join-Path (Get-Location) "resources\media"
          New-Item -ItemType Directory -Path $mediaDir -Force | Out-Null
          Copy-Item (Join-Path $extractDir "ffmpeg.exe") (Join-Path $mediaDir "ffmpeg.exe") -Force
          Copy-Item (Join-Path $extractDir "ffprobe.exe") (Join-Path $mediaDir "ffprobe.exe") -Force
          & (Join-Path $mediaDir "ffmpeg.exe") -version | Select-Object -First 2

      - name: Typecheck, lint, and unit tests (with real Windows FFmpeg)
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test

      - name: Build Windows x64 NSIS installer (with bundled FFmpeg)
        run: pnpm build:win

      - name: Verify installer output and compute SHA-256
        id: installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "release" -Filter "AIVORA-Studio-Setup-*.exe" | Select-Object -First 1
          if (-not $exe) { throw "未在 release 目录找到 NSIS 安装包" }
          $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "Installer: $($exe.Name)"
          Write-Host "Size: $([Math]::Round($exe.Length / 1MB, 2)) MB"
          Write-Host "SHA-256: $hash"
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Non-admin HKCU silent install, Chinese+space path & bundled FFmpeg MP4 export smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installerPath = "${{ steps.installer.outputs.path }}"
          $installDir = Join-Path $env:LOCALAPPDATA "Programs\AIVORA Studio"
          $installedExe = Join-Path $installDir "AIVORA Studio.exe"
          $uninstallExe = Join-Path $installDir "Uninstall AIVORA Studio.exe"

          # Run silent installer with LIMITED (non-admin) privileges via Task Scheduler to verify true per-user HKCU install
          $taskName = "AivoraNonAdminInstall"
          $installCmd = "`"$installerPath`" /S /currentuser"
          schtasks /Create /TN $taskName /TR $installCmd /SC ONCE /ST 23:59 /RL LIMITED /F | Out-Null
          try {
            schtasks /Run /TN $taskName | Out-Null
            $deadline = (Get-Date).AddMinutes(3)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 2
              if (Test-Path $installedExe) {
                $running = Get-Process -Name ([System.IO.Path]::GetFileNameWithoutExtension($installerPath)) -ErrorAction SilentlyContinue
                if (-not $running) { break }
              }
            }
          } finally {
            schtasks /Delete /TN $taskName /F 2>$null | Out-Null
          }

          if (-not (Test-Path $installedExe)) {
            throw "非管理员静默安装失败：未在 $installedExe 找到主程序"
          }
          Write-Host "Installed successfully at: $installedExe"

          # Ensure zero HKLM uninstall entries were created (strictly per-user HKCU)
          $hklmPaths = @(
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $hklmHits = Get-ItemProperty $hklmPaths -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like "*AIVORA Studio*" }
          if ($hklmHits) {
            throw "检测到 HKLM 注册表写入，违反普通用户 HKCU 安装规范"
          }

          # Launch installed app in headless smoke mode with Chinese + space workspace path + bundled FFmpeg export
          $workspaceDir = Join-Path $env:RUNNER_TEMP "测试 作品 空间"
          $smokeReport = Join-Path $env:RUNNER_TEMP "aivora-smoke-report.json"
          New-Item -ItemType Directory -Path $workspaceDir -Force | Out-Null
          if (Test-Path $smokeReport) { Remove-Item $smokeReport -Force }

          $env:AIVORA_WORKSPACE_DIR = $workspaceDir
          $env:AIVORA_SMOKE_REPORT = $smokeReport
          $proc = Start-Process -FilePath $installedExe -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            throw "安装包启动冒烟失败，退出码：$($proc.ExitCode)"
          }
          if (-not (Test-Path $smokeReport)) {
            throw "未生成冒烟测试报告：$smokeReport"
          }
          $report = Get-Content -Path $smokeReport -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host ($report | ConvertTo-Json -Depth 4)
          if (-not $report.ok -or $report.sqliteEngine -ne "node:sqlite" -or -not $report.ffmpegAvailable -or -not $report.exportOk) {
            throw "冒烟报告校验未通过（SQLite 或内置 FFmpeg 成片导出未通过）"
          }
          if (-not (Test-Path $report.exportedPath)) {
            throw "未找到导出的中文名 MP4 成片：$($report.exportedPath)"
          }
          Write-Host "Verified real exported MP4: $($report.exportedPath) ($([Math]::Round((Get-Item $report.exportedPath).Length / 1KB, 1)) KB)"

          # Silent uninstall and confirm user project workspace is preserved
          if (Test-Path $uninstallExe) {
            Start-Process -FilePath $uninstallExe -ArgumentList "/S" -Wait
          }
          if (-not (Test-Path $report.projectDir)) {
            throw "卸载后用户作品目录被意外删除：$($report.projectDir)"
          }
          Write-Host "Uninstall preserved user project directory: $($report.projectDir)"

      - name: Upload Stage 2 Windows NSIS installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIVORA-Studio-Setup-win-x64
          path: |
            release/AIVORA-Studio-Setup-*.exe
          if-no-files-found: error
          retention-days: 14
