appId: com.aivora.studio
productName: AIVORA Studio
copyright: Copyright © 2026 AIVORA Studio
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AIVORA-Studio-Setup-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AIVORA Studio
  deleteAppDataOnUninstall: false
  unicode: true
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"
