appId: com.aivora.studio
productName: AIVORA Studio
copyright: Copyright © 2026 AIVORA Studio
directories:
  buildResources: build
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: AIVORA-Studio-Setup-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AIVORA Studio
  deleteAppDataOnUninstall: false
  unicode: true
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: AudioVideo
  icon: build/icon.png
  executableName: aivora-studio
  artifactName: AIVORA-Studio-${version}-linux-x64.${ext}
  desktop:
    entry:
      Name: AIVORA Studio
      Comment: AI-native motion comic & short-drama workbench
      Categories: AudioVideo;Video;
extraResources:
  - from: resources
    to: .
    filter:
      - "**/*"
